project_id = "website"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets."product-images"]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets."homepage-media"]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets."payment-proofs"]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "application/pdf"]

[storage.buckets."refund-evidence"]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[functions.owner-manage-account-password]
verify_jwt = true
